# Render Blueprint: New → Blueprint → select this repo. Creates a PostgreSQL database and two web services.
# After the first deploy, set:
#   backend  APP_URL      = the frontend's URL   (https://allowance-frontend-xxxx.onrender.com)
#   frontend BACKEND_URL  = the backend's URL    (https://allowance-backend-xxxx.onrender.com)
# then redeploy the frontend (BACKEND_URL is read at build time).
services:
  - type: web
    name: allowance-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: cd .. && npm ci && npm run build -w backend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: APP_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: allowance-db
          property: connectionString
      - key: MERCHANT_API_KEY
        generateValue: true
      - key: CHANNEL3_API_KEY
        sync: false

  - type: web
    name: allowance-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: cd .. && npm ci && npm run build -w frontend
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false

databases:
  - name: allowance-db
    plan: free
    databaseName: allowance
