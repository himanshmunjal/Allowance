          maxLength: 80
        item:
          type: string
          description: What is being sold
          example: Yoga mat
          minLength: 2
          maxLength: 160
        price:
          type: number
          description: Price in US dollars. The agent cannot change it
          example: 36
          minimum: 0
          maximum: 10000
          exclusiveMinimum: true
        category:
